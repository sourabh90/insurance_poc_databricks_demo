name: MLOps Pipeline

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        required: true
        default: dev
        type: choice
        options: [dev, prod]

      run_training:
        description: "Run model training"
        required: true
        default: true
        type: boolean

      run_validation:
        description: "Run model validation (threshold gates)"
        required: true
        default: true
        type: boolean

      run_inference:
        description: "Run batch inference"
        required: true
        default: true
        type: boolean

      run_monitoring:
        description: "Refresh Lakehouse Monitor"
        required: true
        default: true
        type: boolean

jobs:
  mlops:
    name: MLOps Pipeline
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main

      - name: Deploy bundle
        run: databricks bundle deploy --target ${{ inputs.target }} --auto-approve

      - name: Train severity model
        if: ${{ inputs.run_training }}
        run: databricks bundle run insurance_poc_ml_training_job --target ${{ inputs.target }}

      - name: Validate champion model
        if: ${{ inputs.run_validation }}
        run: databricks bundle run insurance_poc_validate_model --target ${{ inputs.target }}

      - name: Batch inference
        if: ${{ inputs.run_inference }}
        run: databricks bundle run insurance_poc_batch_inference --target ${{ inputs.target }}

      - name: Refresh Lakehouse Monitor
        if: ${{ inputs.run_monitoring }}
        run: databricks bundle run insurance_poc_setup_monitor --target ${{ inputs.target }}
