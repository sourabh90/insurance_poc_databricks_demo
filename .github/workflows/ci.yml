name: CI/CD

on:
  push:
    branches:
      - main
      - 'feature*'
      - 'feature/**'
  pull_request:
    branches: [main]

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check src/ tests/

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest tests/ -v --tb=short

  validate:
    name: Bundle Validate
    runs-on: ubuntu-latest
    needs: [lint, test]
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@main

      - name: Validate bundle (dev)
        run: databricks bundle validate --target dev
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

  deploy:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: [validate]
    environment: dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature'))
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@main

      - name: Bootstrap UC catalogs (dev)
        run: python3 scripts/bootstrap_catalogs.py --target dev
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Deploy bundle (dev)
        run: databricks bundle deploy --target dev
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Resolve bundle root path
        id: bundle_root
        run: |
          ROOT=$(databricks bundle validate --target dev --output json \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['workspace']['root_path'])")
          echo "path=${ROOT}" >> "$GITHUB_OUTPUT"
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Deploy billing app (dev)
        run: |
          STATE=$(databricks apps get databricks-billing-usage-dev --output json \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('compute_status',{}).get('state','STOPPED'))")
          if [ "$STATE" != "ACTIVE" ]; then
            databricks apps start databricks-billing-usage-dev
          fi
          for i in $(seq 1 18); do
            DEPLOY_STATE=$(databricks apps get databricks-billing-usage-dev --output json \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('active_deployment',{}).get('status',{}).get('state','NONE'))")
            if [ "$DEPLOY_STATE" != "IN_PROGRESS" ]; then break; fi
            echo "Billing app deployment in progress, waiting 10s... ($i/18)"
            sleep 10
          done
          databricks apps deploy databricks-billing-usage-dev \
            --source-code-path "${{ steps.bundle_root.outputs.path }}/files/src/app/billing"
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Deploy fraud intelligence app (dev)
        run: |
          STATE=$(databricks apps get fraud-intelligence-dev --output json \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('compute_status',{}).get('state','STOPPED'))")
          if [ "$STATE" != "ACTIVE" ]; then
            databricks apps start fraud-intelligence-dev
          fi
          for i in $(seq 1 18); do
            DEPLOY_STATE=$(databricks apps get fraud-intelligence-dev --output json \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('active_deployment',{}).get('status',{}).get('state','NONE'))")
            if [ "$DEPLOY_STATE" != "IN_PROGRESS" ]; then break; fi
            echo "Fraud app deployment in progress, waiting 10s... ($i/18)"
            sleep 10
          done
          databricks apps deploy fraud-intelligence-dev \
            --source-code-path "${{ steps.bundle_root.outputs.path }}/files/src/app/fraud"
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
