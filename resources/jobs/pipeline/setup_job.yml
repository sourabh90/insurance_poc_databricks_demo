resources:
  jobs:
    insurance_poc_databricks_demo_setup:
      name: "[${bundle.target}] insurance_poc - Job - 1. Setup"
      tasks:
        - task_key: create_catalogs_schemas_volumes
          notebook_task:
            notebook_path: ../../../src/notebooks/pipeline/setup_catalogs.py
            base_parameters:
              bronze_catalog:        ${var.bronze_catalog}
              silver_catalog:        ${var.silver_catalog}
              gold_catalog:          ${var.gold_catalog}
              monitoring_catalog:    ${var.monitoring_catalog}
              bronze_schema:         ${var.bronze_schema}
              silver_schema:         ${var.silver_schema}
              app_service_principal:       ${var.app_service_principal}
              fraud_app_service_principal: ${var.fraud_app_service_principal}
      permissions:
        - level: CAN_VIEW
          group_name: "users"
