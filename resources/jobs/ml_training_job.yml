resources:
  jobs:
    insurance_poc_ml_training_job:
      name: "[${bundle.target}] insurance_poc - Job - ML Severity Model Training"
      tasks:
        - task_key: train_severity_model
          max_retries: 1
          notebook_task:
            notebook_path: ../../src/notebooks/train_severity_model.py
            base_parameters:
              gold_catalog:       ${var.gold_catalog}
              ml_experiment_name: ${var.ml_experiment_name}
              ml_model_name:      ${var.ml_model_name}
      permissions:
        - level: CAN_VIEW
          group_name: "users"
